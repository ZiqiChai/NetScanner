app-id: io.github.ZiqiChai.NetScanner
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: netscanner
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: netscanner
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - build-release
          - dist
          - repo
          - .git
          - .flatpak-builder
          - build-flatpak
